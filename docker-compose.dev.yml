version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vvetooling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "7000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vvetooling"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - vvetooling_db:/var/lib/postgresql/data
    networks:
      - vvetooling_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: vvetooling
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      ALLOWED_ORIGINS: '["http://localhost:81"]'
    ports:
      - "7001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',8000)); s.close()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vvetooling_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7001/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vvetooling_net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - vvetooling_net

volumes:
  vvetooling_db:

networks:
  vvetooling_net:
